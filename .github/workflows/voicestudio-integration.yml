name: VoiceStudio integration

on:
  push:
    branches:
      - feat/voicestudio-provider
    paths:
      - "app/**"
      - "deploy/voicestudio/**"
      - ".github/workflows/voicestudio-integration.yml"
      - "gradle/**"
      - "settings.gradle.kts"
  pull_request:
    paths:
      - "app/**"
      - "deploy/voicestudio/**"
      - ".github/workflows/voicestudio-integration.yml"
      - "gradle/**"
      - "settings.gradle.kts"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Test and build
        run: gradle :app:test :app:fatJar --no-daemon --stacktrace

      - name: Verify fat jar
        run: test -n "$(find app/build/libs -maxdepth 1 -name '*-all.jar' -print -quit)"
