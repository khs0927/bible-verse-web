name: Import Bible Friend story assets
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/bible-friend-story-assets-trigger.txt'
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Download existing generated story artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/bible-friend/story
          download() {
            out="$1"; url="$2"
            curl -fL --retry 3 --retry-delay 2 "$url" -o "assets/bible-friend/story/$out"
          }
          download '01-david-goliath.png' 'https://cdn.creativeclaw.co/u/448e94a9/images/2f145564-6a43-4bdb-a560-86e81cb098fe.png'
          download '02-noah-ark.png' 'https://cdn.creativeclaw.co/u/448e94a9/images/85af64f7-68b6-4b1c-a2d0-17ab93cf52b6.png'
          download '03-jonah-whale.png' 'https://cdn.creativeclaw.co/u/448e94a9/images/864ec02d-6191-4f3a-921b-95ae39031dab.png'
          download '04-jesus-birth.png' 'https://cdn.creativeclaw.co/u/448e94a9/images/422da108-c85c-46f0-a805-281262cda3b1.png'
          download '05-good-samaritan.png' 'https://cdn.creativeclaw.co/u/448e94a9/images/fcac6d0e-d944-4626-90bf-27530d78e535.png'
          download '06-lost-sheep.png' 'https://cdn.creativeclaw.co/u/448e94a9/images/04df2ae2-5e4e-48d8-bf2a-1c1e1e639037.png'
          download '07-resurrection.png' 'https://cdn.creativeclaw.co/u/448e94a9/images/2e085265-a88c-46ff-a382-655bb203f35f.png'
          download '08-creation.png' 'https://cdn.creativeclaw.co/u/448e94a9/images/292b4248-226d-4a74-b62f-d9f86f606ee7.png'
          download '09-jesus-love.png' 'https://cdn.creativeclaw.co/u/448e94a9/images/ca857cf2-3acd-41af-99fb-daf9e7a803c4.png'
          download '10-solomon-wisdom.png' 'https://cdn.creativeclaw.co/u/448e94a9/images/b5a233c9-5700-463f-984b-095785d0b2d5.png'
      - name: Write manifest
        shell: bash
        run: |
          cat > assets/bible-friend/story/manifest.json <<'JSON'
          {
            "collection": "Bible Friend Story",
            "format": "PNG",
            "policy": "download original generated bytes; no resize or recompression",
            "assets": [
              "01-david-goliath.png",
              "02-noah-ark.png",
              "03-jonah-whale.png",
              "04-jesus-birth.png",
              "05-good-samaritan.png",
              "06-lost-sheep.png",
              "07-resurrection.png",
              "08-creation.png",
              "09-jesus-love.png",
              "10-solomon-wisdom.png"
            ]
          }
          JSON
      - name: Commit imported assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/bible-friend/story
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'assets: add Bible Friend story artwork'
          git push origin HEAD:${{ github.head_ref }}