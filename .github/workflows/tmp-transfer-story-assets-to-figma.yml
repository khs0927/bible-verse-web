name: Transfer Bible Friend story assets to Figma
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  transfer:
    if: contains(github.event.pull_request.title, '[FIGMA-STORY-TRANSFER]')
    runs-on: ubuntu-latest
    steps:
      - name: Transfer GitHub raw PNGs to Figma upload slots
        shell: bash
        run: |
          set -euo pipefail
          transfer() {
            name="$1"; src="$2"; dst="$3"
            curl -fL --retry 3 --retry-delay 1 "$src" -o "/tmp/$name"
            curl -fSs -X POST -F "file=@/tmp/$name;filename=$name" "$dst"
            echo "uploaded $name"
          }
          transfer '01-david-goliath.png' 'https://raw.githubusercontent.com/khs0927/bible-verse-web/main/assets/bible-friend/story/01-david-goliath.png' 'https://mcp.figma.com/mcp/upload/06f629c9-cb72-4891-a538-5e579c7b4de8/submit?scaleMode=FIT'
          transfer '02-noah-ark.png' 'https://raw.githubusercontent.com/khs0927/bible-verse-web/main/assets/bible-friend/story/02-noah-ark.png' 'https://mcp.figma.com/mcp/upload/f9e54967-6dce-46c5-9578-83673e0403a1/submit?scaleMode=FIT'
          transfer '03-jonah-whale.png' 'https://raw.githubusercontent.com/khs0927/bible-verse-web/main/assets/bible-friend/story/03-jonah-whale.png' 'https://mcp.figma.com/mcp/upload/be032737-fa07-46f4-9d95-91c90bacdd62/submit?scaleMode=FIT'
          transfer '04-jesus-birth.png' 'https://raw.githubusercontent.com/khs0927/bible-verse-web/main/assets/bible-friend/story/04-jesus-birth.png' 'https://mcp.figma.com/mcp/upload/fe28cdb3-5cae-49bc-8eb4-121fc76d1382/submit?scaleMode=FIT'
          transfer '05-good-samaritan.png' 'https://raw.githubusercontent.com/khs0927/bible-verse-web/main/assets/bible-friend/story/05-good-samaritan.png' 'https://mcp.figma.com/mcp/upload/6ca06ba6-bd0e-4926-b49e-3cfbfbd0d759/submit?scaleMode=FIT'
          transfer '06-lost-sheep.png' 'https://raw.githubusercontent.com/khs0927/bible-verse-web/main/assets/bible-friend/story/06-lost-sheep.png' 'https://mcp.figma.com/mcp/upload/8f9c8723-9d78-477e-b100-01aedcb08e1d/submit?scaleMode=FIT'
          transfer '07-resurrection.png' 'https://raw.githubusercontent.com/khs0927/bible-verse-web/main/assets/bible-friend/story/07-resurrection.png' 'https://mcp.figma.com/mcp/upload/fd308a11-bd1d-4d85-b91b-0c57befeb42c/submit?scaleMode=FIT'
          transfer '08-creation.png' 'https://raw.githubusercontent.com/khs0927/bible-verse-web/main/assets/bible-friend/story/08-creation.png' 'https://mcp.figma.com/mcp/upload/e1ab96b5-919f-44b2-a8cd-d7146528f6a9/submit?scaleMode=FIT'
          transfer '09-jesus-love.png' 'https://raw.githubusercontent.com/khs0927/bible-verse-web/main/assets/bible-friend/story/09-jesus-love.png' 'https://mcp.figma.com/mcp/upload/690851e4-7a61-42e3-bea1-b42e8c998ffe/submit?scaleMode=FIT'
          transfer '10-solomon-wisdom.png' 'https://raw.githubusercontent.com/khs0927/bible-verse-web/main/assets/bible-friend/story/10-solomon-wisdom.png' 'https://mcp.figma.com/mcp/upload/a16a034d-a0f9-4124-9f65-09453bf53b97/submit?scaleMode=FIT'