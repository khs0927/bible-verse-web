name: Kotlin Voice Lab

on:
  push:
    branches:
      - feat/moss-voice-lab-kotlin
    paths:
      - 'voice-lab/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/kotlin-voice-lab.yml'
  pull_request:
    paths:
      - 'voice-lab/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/kotlin-voice-lab.yml'

permissions:
  contents: read

jobs:
  voice-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build runnable Kotlin JS distribution
        run: gradle :voice-lab:jsBrowserDistribution --no-daemon --stacktrace

      - name: Verify production distribution
        run: |
          test -f voice-lab/build/web-dist/index.html
          test -f voice-lab/build/web-dist/voice-lab.js
          ls -lh voice-lab/build/web-dist

      - name: Install WebKit test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Run WebKit Gate 1-3B checks
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory voice-lab/build/web-dist > /tmp/voice-lab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          node voice-lab/e2e/preflight.mjs
          node voice-lab/e2e/tokenizer.mjs
          node voice-lab/e2e/session-load.mjs
          node voice-lab/e2e/synthesis.mjs

      - name: Upload Korean WAV quality gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moss-korean-gate3b
          path: voice-lab/build/quality/
          if-no-files-found: warn
          retention-days: 7
