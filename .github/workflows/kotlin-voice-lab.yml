name: Kotlin Voice Lab

on:
  push:
    branches:
      - feat/moss-voice-lab-kotlin
    paths:
      - 'voice-lab/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/kotlin-voice-lab.yml'
  pull_request:
    paths:
      - 'voice-lab/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/kotlin-voice-lab.yml'

permissions:
  contents: read

jobs:
  voice-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build Kotlin JS voice lab
        run: gradle :voice-lab:jsBrowserProductionWebpack --no-daemon --stacktrace

      - name: Verify production bundle
        run: |
          test -f voice-lab/build/dist/js/productionExecutable/index.html
          test -f voice-lab/build/dist/js/productionExecutable/voice-lab.js
          ls -lh voice-lab/build/dist/js/productionExecutable

      - name: Install WebKit test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Run WebKit Gate 1 preflight
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory voice-lab/build/dist/js/productionExecutable > /tmp/voice-lab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          node voice-lab/e2e/preflight.mjs
