name: Kotlin Voice Lab

on:
  push:
    branches:
      - feat/moss-voice-lab-kotlin
    paths:
      - 'voice-lab/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/kotlin-voice-lab.yml'
  pull_request:
    paths:
      - 'voice-lab/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'settings.gradle.kts'
      - '.github/workflows/kotlin-voice-lab.yml'

permissions:
  contents: read

jobs:
  voice-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build Kotlin JS voice lab
        run: gradle :voice-lab:jsBrowserProductionWebpack --no-daemon --stacktrace
